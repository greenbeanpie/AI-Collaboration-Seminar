[package]
name = "buwei-desktop"
version = "0.1.0"
edition = "2021"
[lib]
name = "buwei_desktop_core"
crate-type = ["rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["time", "fs", "io-util", "sync"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
base64 = "0.22"
minisign-verify = "0.2"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
