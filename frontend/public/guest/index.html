/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ─────────────────────────────────────────────────────────────────────────
 * Apple 令牌块 — 与活动设计系统 tokens.css 保持一致，逐字粘贴；
 * 产品样式一律通过 var(--*) 引用，不在其余位置散落原始色值。
 * ─────────────────────────────────────────────────────────────────── */
:root {
  /* ─── Surface (3 levels) ────────────────────────────────────────── */
  --bg: #ffffff;
  --surface: #f5f5f7;
  --surface-warm: #fbfbfd;

  /* ─── Foreground ramp (4 levels) ───────────────────────────────── */
  --fg: #1d1d1f;
  --fg-2: #424245;
  --muted: #6e6e73;
  --meta: #86868b;

  /* ─── Border (2 levels) ────────────────────────────────────────── */
  --border: #d2d2d7;
  --border-soft: #e8e8ed;

  /* ─── Accent ────────────────────────────────────────────────────── */
  --accent: #0071e3;
  --accent-on: #ffffff;

  /* ─── Accent states ─────────────────────────────────────────────── */
  --accent-hover: #0077ed;
  --accent-active: #0066cc;

  /* ─── Semantic ──────────────────────────────────────────────────── */
  --success: #16a34a;
  --warn:    #eab308;
  --danger:  #dc2626;

  /* ─── Typography ────────────────────────────────────────────────── */
  --font-display:
    "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body:
    "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono:
    "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;

  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 17px;
  --text-lg:   21px;
  --text-xl:   28px;
  --text-2xl:  40px;
  --text-3xl:  56px;
  --text-4xl:  80px;

  --leading-body:  1.47;
  --leading-tight: 1.05;

  --tracking-display: -0.015em;

  /* ─── Spacing ───────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  /* ─── Section rhythm ────────────────────────────────────────────── */
  --section-y-desktop: 100px;
  --section-y-tablet:  64px;
  --section-y-phone:   40px;

  /* ─── Radius ────────────────────────────────────────────────────── */
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   18px;
  --radius-pill: 980px;

  /* ─── Elevation (3 levels) ──────────────────────────────────────── */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.08);

  /* ─── Focus ring ────────────────────────────────────────────────── */
  --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);

  /* ─── Motion ────────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   220ms;
  --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);

  /* ─── Layout ────────────────────────────────────────────────────── */
  --container-max:            1024px;
  --container-gutter-desktop: 22px;
  --container-gutter-tablet:  18px;
  --container-gutter-phone:   16px;
}

/* ─── 应用级附加令牌（暗色章节、外壳几何、弹层阴影）────────────── */
:root {
  --stage:        #000000;   /* 深色章节画布（登录、演练深场景） */
  --stage-2:      #1d1d1f;
  --stage-3:      #272729;
  --rail-w:       232px;
  --topbar-h:     52px;
  --tabbar-h:     62px;
  --content-max:  1180px;
  --shadow-pop:   0 18px 48px rgba(0, 0, 0, 0.16);
  --scrim:        color-mix(in oklab, var(--stage), transparent 42%);
  --glass:        color-mix(in oklab, var(--bg), transparent 18%);
  --glass-dark:   color-mix(in oklab, var(--stage-3), transparent 26%);
}

/* ─── Base ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body), "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  font-size: var(--text-base);
  line-height: var(--leading-body);
  letter-spacing: -0.016em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4 {
  font-family: var(--font-display), "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  margin: 0;
  color: var(--fg);
  letter-spacing: var(--tracking-display);
}
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
img, svg { display: block; }
a { color: var(--accent-active); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
::selection { background: color-mix(in oklab, var(--accent), transparent 78%); }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }
:where(a, button, input, select, textarea, [contenteditable], [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.meta-text { color: var(--meta); }
.small { font-size: var(--text-sm); }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.divider { height: 1px; background: var(--border-soft); border: 0; margin: 0; }
.eyebrow {
  font-family: var(--font-display), "PingFang SC", sans-serif;
  font-size: var(--text-xs);
  font-weight: 600;
  line-height: 1;
  color: var(--accent);
  letter-spacing: 0.08em;
}
.grow { flex: 1 1 0; min-width: 0; }

/* ─── 应用外壳 ──────────────────────────────────────────────────── */
.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100vh;
}
.rail {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-warm);
  border-right: 1px solid var(--border-soft);
  padding: var(--space-4) var(--space-3);
  gap: var(--space-2);
  z-index: 30;
}
.rail-brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3) var(--space-4);
}
.rail-mark {
  width: 34px; height: 34px; flex: none;
  border-radius: 10px;
  display: grid; place-items: center;
  background: var(--fg);
  color: var(--bg);
  font-family: var(--font-display), sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.rail-name { display: grid; gap: 1px; line-height: 1.2; }
.rail-name strong { font-size: var(--text-sm); font-weight: 600; }
.rail-name span { font-size: var(--text-xs); color: var(--meta); }
.rail-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; padding-block: var(--space-2); }
.rail-group { padding: var(--space-4) var(--space-3) var(--space-1); font-size: var(--text-xs); color: var(--meta); letter-spacing: 0.06em; }
.rail-link {
  display: flex; align-items: center; gap: 10px;
  padding: 8px var(--space-3);
  border-radius: var(--radius-sm);
  color: var(--fg-2);
  font-size: var(--text-sm);
  line-height: 1.3;
  transition: background-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.rail-link:hover { background: color-mix(in oklab, var(--fg), transparent 94%); color: var(--fg); text-decoration: none; }
.rail-link[aria-current="page"] {
  background: var(--bg);
  color: var(--fg);
  font-weight: 600;
  box-shadow: var(--elev-ring);
}
.rail-link[aria-current="page"] .icon { color: var(--accent); }
.rail-link .icon { color: var(--meta); flex: none; }
.rail-link .rail-count {
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--accent-active);
  background: color-mix(in oklab, var(--accent), transparent 90%);
  border-radius: var(--radius-pill);
  padding: 1px 7px;
  font-weight: 600;
}
.rail-foot { display: grid; gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--border-soft); }
.rail-user { display: flex; align-items: center; gap: 10px; padding: 4px var(--space-3); min-width: 0; }
.rail-user .avatar { flex: none; }
.rail-user-name { display: grid; line-height: 1.25; min-width: 0; }
.rail-user-name strong { font-size: var(--text-sm); font-weight: 600; }
.rail-user-name span { font-size: var(--text-xs); color: var(--meta); }

.col { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 25;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: var(--space-3);
  padding-inline: var(--space-6);
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border-soft);
}
.topbar-title {
  font-family: var(--font-display), "PingFang SC", sans-serif;
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: var(--space-2);
  min-width: 0;
}
.topbar-title .crumb-root { color: var(--meta); font-weight: 400; }
.topbar .spacer { flex: 1 1 auto; }
.topbar-deadline { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-2); background: var(--surface); border-radius: var(--radius-pill); padding: 4px 10px; white-space: nowrap; }
.topbar-deadline .icon { color: var(--muted); }
.view {
  flex: 1;
  min-width: 0;
  padding: var(--space-8) var(--space-6) 80px;
}
.view:focus { outline: none; }
.wrap { max-width: var(--content-max); margin-inline: auto; }
.page-head { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
.page-head h1 {
  font-size: clamp(26px, 3.2vw, 34px);
  font-weight: 600;
  line-height: 1.12;
}
.page-head .sub { margin-top: 8px; color: var(--muted); font-size: var(--text-sm); line-height: 1.55; max-width: 62ch; }
.page-head .actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

/* 路由进入动画 */
.view.enter > .wrap, .view.enter > .login { animation: rise 320ms var(--ease-standard) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: rise 340ms var(--ease-standard) both; animation-delay: calc(var(--i, 0) * 40ms); }

/* ─── 按钮 ──────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  padding: 8px 16px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-family: var(--font-body), "PingFang SC", sans-serif;
  font-weight: 500;
  font-size: var(--text-sm);
  line-height: 1.2;
  letter-spacing: -0.01em;
  text-decoration: none;
  transition:
    background-color var(--motion-fast) var(--ease-standard),
    border-color var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard),
    transform var(--motion-fast) var(--ease-standard),
    box-shadow var(--motion-fast) var(--ease-standard);
  white-space: nowrap;
}
.btn:hover { text-decoration: none; }
.btn:active { transform: scale(0.985); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
.btn-pri { background: var(--accent); color: var(--accent-on); }
.btn-pri:hover { background: var(--accent-hover); }
.btn-pri:active { background: var(--accent-active); }
.btn-sec { background: transparent; color: var(--fg); border-color: var(--border); }
.btn-sec:hover { background: var(--surface); border-color: var(--meta); }
.btn-dark { background: var(--fg); color: var(--accent-on); }
.btn-dark:hover { background: var(--fg-2); }
.btn-ghost { color: var(--accent-active); padding-inline: 10px; }
.btn-ghost:hover { background: color-mix(in oklab, var(--accent), transparent 92%); }
.btn-danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger), transparent 62%); background: transparent; }
.btn-danger:hover { background: color-mix(in oklab, var(--danger), transparent 92%); }
.btn-pill { border-radius: var(--radius-pill); padding: 10px 20px; }
.btn-sm { padding: 5px 11px; font-size: var(--text-xs); border-radius: var(--radius-sm); }
.btn-icon { padding: 7px; border-radius: var(--radius-sm); color: var(--muted); }
.btn-icon:hover { color: var(--fg); background: var(--surface); }
.btn .icon { flex: none; }
.icon { width: 16px; height: 16px; flex: none; }
.icon-lg { width: 18px; height: 18px; }
.icon-xl { width: 22px; height: 22px; }

/* ─── 徽标 / 标签 ───────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge-muted   { color: var(--muted);   background: color-mix(in oklab, var(--muted), transparent 90%); }
.badge-accent  { color: var(--accent-active); background: color-mix(in oklab, var(--accent), transparent 90%); }
.badge-success { color: var(--success); background: color-mix(in oklab, var(--success), transparent 90%); }
.badge-warn    { color: color-mix(in oklab, var(--warn), var(--fg) 28%); background: color-mix(in oklab, var(--warn), transparent 86%); }
.badge-danger  { color: var(--danger);  background: color-mix(in oklab, var(--danger), transparent 90%); }
.badge-dark    { color: var(--bg); background: var(--stage-3); }
.badge-demo {
  color: var(--accent-active);
  background: color-mix(in oklab, var(--accent), transparent 90%);
  border: 1px solid color-mix(in oklab, var(--accent), transparent 78%);
}
.badge-ai {
  color: var(--bg);
  background: linear-gradient(120deg, var(--accent), var(--accent-active));
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--surface-warm);
  color: var(--fg-2);
  font-size: var(--text-xs);
  line-height: 1.5;
  white-space: nowrap;
}
.chip .icon { width: 12px; height: 12px; color: var(--meta); }
.chip-src { cursor: pointer; transition: border-color var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard); }
.chip-src:hover { border-color: var(--accent); background: color-mix(in oklab, var(--accent), transparent 94%); }
.chip-btn { cursor: pointer; background: var(--bg); color: var(--fg-2); border-color: var(--border); }
.chip-btn:hover { border-color: var(--meta); }
.chip-btn[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip-btn[aria-pressed="true"] .icon { color: var(--bg); }

/* ─── 分段控件 ──────────────────────────────────────────────────── */
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border-radius: var(--radius-pill); }
.seg button {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  color: var(--muted);
  transition: background-color var(--motion-base) var(--ease-standard), color var(--motion-base) var(--ease-standard), box-shadow var(--motion-base) var(--ease-standard);
}
.seg button .icon { width: 14px; height: 14px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-selected="true"] {
  background: var(--bg);
  color: var(--fg);
  font-weight: 600;
  box-shadow: var(--elev-ring);
}
.seg-sm button { padding: 5px 12px; font-size: var(--text-xs); }

/* ─── 卡片 ──────────────────────────────────────────────────────── */
.card {
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  transition: box-shadow var(--motion-base) var(--ease-standard), border-color var(--motion-base) var(--ease-standard);
}
.card-hover:hover { box-shadow: var(--elev-raised); border-color: var(--border); }
.card-flat { background: var(--surface); border-color: transparent; }
.card-warm { background: var(--surface-warm); }
.card-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
.card-head h2 { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; }
.card-head h3 { font-size: var(--text-base); font-weight: 600; }
.card-head .icon { color: var(--muted); }
.card-head .grow { min-width: 0; }
.card-head .sub { font-size: var(--text-xs); color: var(--meta); margin-top: 2px; }

/* ─── 字段 / 表单 ───────────────────────────────────────────────── */
.field { display: grid; gap: 6px; }
.field > label { font-size: var(--text-sm); font-weight: 500; color: var(--fg); }
.field .help { font-size: var(--text-xs); color: var(--muted); line-height: 1.5; }
.field .err { font-size: var(--text-xs); color: var(--danger); display: flex; align-items: center; gap: 5px; }
.input, .select, .textarea {
  width: 100%;
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  font-size: var(--text-sm);
  line-height: 1.45;
  outline: none;
  transition: border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
}
.input::placeholder, .textarea::placeholder { color: var(--meta); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--meta); }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
.input.invalid, .textarea.invalid { border-color: var(--danger); }
.select { appearance: none; padding-right: 34px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 12px center;
}
.textarea { resize: vertical; min-height: 92px; }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: var(--text-sm); line-height: 1.5; }
.check input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.radio-row { display: grid; gap: var(--space-2); }

/* ─── 头像 ──────────────────────────────────────────────────────── */
.avatar {
  width: 34px; height: 34px; flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface);
  color: var(--fg-2);
  font-size: var(--text-xs);
  font-weight: 600;
  border: 1px solid var(--border-soft);
  letter-spacing: 0;
}
.avatar-lg { width: 44px; height: 44px; font-size: var(--text-sm); }
.avatar-owner { background: color-mix(in oklab, var(--accent), transparent 88%); color: var(--accent-active); border-color: color-mix(in oklab, var(--accent), transparent 70%); }
.avatar-stack { display: flex; }
.avatar-stack .avatar { margin-left: -8px; border: 2px solid var(--bg); }
.avatar-stack .avatar:first-child { margin-left: 0; }

/* ─── 统计 / 环形 ───────────────────────────────────────────────── */
.stat-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
.stat { padding: var(--space-4) var(--space-5); }
.stat .stat-label { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--muted); }
.stat .stat-value { font-family: var(--font-display), "PingFang SC", sans-serif; font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.stat .stat-value .unit { font-size: var(--text-sm); font-weight: 500; color: var(--muted); }
.stat .stat-foot { font-size: var(--text-xs); color: var(--meta); }
.ring { position: relative; width: var(--size, 128px); height: var(--size, 128px); flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--border-soft); stroke-width: var(--stroke, 9); }
.ring .val { fill: none; stroke: var(--accent); stroke-width: var(--stroke, 9); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease-standard); }
.ring .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.ring .ring-label strong { font-family: var(--font-display), sans-serif; font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.ring .ring-label span { font-size: var(--text-xs); color: var(--muted); }
.ring-sm { --size: 92px; }
.ring-sm .ring-label strong { font-size: 19px; }

.bar { height: 6px; border-radius: var(--radius-pill); background: var(--border-soft); overflow: hidden; }
.bar > i {
  display: block; height: 100%; width: 0;
  border-radius: inherit;
  background: var(--accent);
  transition: width 480ms var(--ease-standard);
}
.bar.run > i {
  background-image: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.5) 50%, transparent 80%);
  background-size: 180% 100%;
  animation: sheen 1.3s linear infinite;
}
@keyframes sheen { from { background-position: 140% 0; } to { background-position: -40% 0; } }
.bar-sm { height: 4px; }

/* ─── 骨架屏 ────────────────────────────────────────────────────── */
.sk {
  border-radius: var(--radius-sm);
  background: linear-gradient(100deg, var(--surface) 38%, color-mix(in oklab, var(--surface), var(--bg) 55%) 50%, var(--surface) 62%);
  background-size: 220% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer { from { background-position: 160% 0; } to { background-position: -60% 0; } }
.sk-line { height: 12px; margin-block: 7px; }
.sk-line.w60 { width: 60%; }
.sk-line.w40 { width: 40%; }

/* ─── 表格 ──────────────────────────────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  text-align: left; font-size: var(--text-xs); color: var(--meta); font-weight: 500;
  padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
.tbl td { padding: 12px; border-bottom: 1px solid var(--border-soft); font-size: var(--text-sm); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background-color var(--motion-fast) var(--ease-standard); }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tbody tr.clickable:hover { background: var(--surface-warm); }
.tbl .num { font-variant-numeric: tabular-nums; }
.overdue { color: var(--danger); font-weight: 600; }

/* ─── 看板 ──────────────────────────────────────────────────────── */
.kanban-scroll { overflow-x: auto; padding-bottom: var(--space-2); }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(248px, 1fr)); gap: var(--space-4); min-width: 1040px; }
.kcol { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); min-height: 220px; }
.kcol-head { display: flex; align-items: center; gap: var(--space-2); padding: 4px 6px 8px; }
.kcol-head strong { font-size: var(--text-sm); font-weight: 600; }
.kcol-head .kcount { font-size: var(--text-xs); color: var(--muted); background: var(--bg); border-radius: var(--radius-pill); padding: 1px 8px; }
.kcol.drop-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: color-mix(in oklab, var(--accent), transparent 96%); }
.kcard {
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  display: grid; gap: 8px;
  cursor: grab;
  transition: box-shadow var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard), opacity var(--motion-fast) var(--ease-standard);
}
.kcard:hover { box-shadow: var(--elev-raised); transform: translateY(-1px); }
.kcard.dragging { opacity: 0.45; transform: scale(0.99); cursor: grabbing; }
.kcard-title { font-size: var(--text-sm); font-weight: 500; line-height: 1.45; }
.kcard-foot { display: flex; align-items: center; gap: 8px; }
.kcard-foot .due { font-size: var(--text-xs); color: var(--meta); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.kcard-foot .due.late { color: var(--danger); }
.kcard .avatar { width: 24px; height: 24px; font-size: 10px; }
.kcard-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.kcard-tags .chip { padding: 1px 7px; }

/* ─── 时间线 ────────────────────────────────────────────────────── */
.timeline { position: relative; display: grid; gap: var(--space-4); padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 1px; background: var(--border-soft); }
.titem { position: relative; display: grid; gap: 4px; }
.titem::before {
  content: ""; position: absolute; left: -22px; top: 6px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--meta);
}
.titem[data-type="decision"]::before { border-color: var(--accent); }
.titem[data-type="ai"]::before { border-color: color-mix(in oklab, var(--accent), var(--bg) 35%); background: color-mix(in oklab, var(--accent), transparent 40%); }
.titem[data-type="contribution"]::before { border-color: var(--success); }
.titem[data-type="source"]::before { border-color: var(--warn); }
.titem[data-type="correction"]::before { border-color: var(--danger); }
.titem .t-head { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.titem .t-title { font-size: var(--text-sm); font-weight: 500; }
.titem .t-detail { font-size: var(--text-xs); color: var(--muted); line-height: 1.6; }
.titem .t-when { font-size: var(--text-xs); color: var(--meta); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ─── 过程日志 / 步骤 ───────────────────────────────────────────── */
.log {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.9;
  background: var(--surface-warm);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  min-height: 118px;
  max-height: 200px;
  overflow-y: auto;
  color: var(--fg-2);
}
.log .l-ok { color: var(--success); }
.log .l-run { color: var(--accent-active); }
.log .l-err { color: var(--danger); }
.log .l-wait { color: var(--meta); }
.steps { display: grid; gap: 10px; }
.step { display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); color: var(--muted); }
.step .s-dot {
  width: 18px; height: 18px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--meta);
  transition: all var(--motion-base) var(--ease-standard);
}
.step .s-dot .icon { width: 10px; height: 10px; }
.step[data-s="run"] { color: var(--fg); }
.step[data-s="run"] .s-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 88%); animation: pulse 1.4s ease-in-out infinite; }
.step[data-s="done"] { color: var(--fg-2); }
.step[data-s="done"] .s-dot { border-color: var(--success); background: color-mix(in oklab, var(--success), transparent 88%); color: var(--success); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 88%); } 50% { box-shadow: 0 0 0 7px color-mix(in oklab, var(--accent), transparent 94%); } }

/* ─── 空状态 ────────────────────────────────────────────────────── */
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: var(--space-8) var(--space-4); color: var(--muted); }
.empty .e-icon { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--meta); }
.empty strong { color: var(--fg); font-size: var(--text-sm); }
.empty p { font-size: var(--text-xs); max-width: 46ch; line-height: 1.6; }

/* ─── 弹层：模态 / 抽屉 / 吐司 ─────────────────────────────────── */
.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: 0; transition: opacity var(--motion-base) var(--ease-standard);
}
.scrim.open { opacity: 1; }
.scrim.closing { opacity: 0; transition-duration: 140ms; }
.modal-host { position: fixed; inset: 0; z-index: 61; display: grid; place-items: center; padding: var(--space-4); pointer-events: none; }
.modal {
  pointer-events: auto;
  width: min(560px, 100%);
  max-height: min(84vh, 760px);
  overflow: auto;
  background: var(--bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop);
  border: 1px solid var(--border-soft);
  padding: var(--space-6);
  opacity: 0; transform: translateY(14px) scale(0.985);
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
}
.modal.wide { width: min(760px, 100%); }
.scrim.open + .modal-host .modal, .modal.open { opacity: 1; transform: none; }
.modal.closing { opacity: 0; transform: translateY(8px) scale(0.99); transition-duration: 140ms; }
.modal-head { display: flex; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-4); }
.modal-head h3 { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; }
.modal-head .sub { font-size: var(--text-xs); color: var(--muted); margin-top: 4px; line-height: 1.6; }
.modal-head .btn-icon { margin-left: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-5); flex-wrap: wrap; }
.drawer-host { position: fixed; inset: 0; z-index: 61; display: flex; justify-content: flex-end; pointer-events: none; }
.drawer {
  pointer-events: auto;
  width: min(520px, 100%);
  height: 100%;
  background: var(--bg);
  box-shadow: var(--shadow-pop);
  border-left: 1px solid var(--border-soft);
  display: flex; flex-direction: column;
  transform: translateX(102%);
  transition: transform 260ms var(--ease-standard);
}
.drawer.open { transform: none; }
.drawer.closing { transform: translateX(102%); transition-duration: 170ms; }
.drawer-head { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--border-soft); }
.drawer-head h3 { font-size: var(--text-lg); font-weight: 600; }
.drawer-head .sub { font-size: var(--text-xs); color: var(--muted); margin-top: 3px; }
.drawer-head .btn-icon { margin-left: auto; }
.drawer-body { flex: 1; overflow-y: auto; padding: var(--space-5); display: grid; gap: var(--space-4); align-content: start; }
.drawer-foot { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border-soft); display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; }
.toasts { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 10px;
  background: color-mix(in oklab, var(--stage-3), transparent 6%);
  color: var(--bg);
  border-radius: var(--radius-pill);
  padding: 9px 18px 9px 14px;
  font-size: var(--text-sm);
  box-shadow: var(--shadow-pop);
  animation: toast-in 300ms var(--ease-standard) both;
  max-width: min(92vw, 560px);
}
.toast.out { animation: toast-out 190ms var(--ease-standard) both; }
.toast .icon { color: color-mix(in oklab, var(--bg), transparent 25%); }
.toast[data-kind="success"] .icon { color: color-mix(in oklab, var(--success), var(--bg) 35%); }
.toast[data-kind="error"] .icon { color: color-mix(in oklab, var(--danger), var(--bg) 35%); }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(8px) scale(0.98); } }

/* ─── 聊天气泡（答辩 / AI）─────────────────────────────────────── */
.chat { display: grid; gap: var(--space-4); align-content: start; }
.msg { display: grid; gap: 6px; max-width: 88%; }
.msg .msg-meta { display: flex; align-items: center; gap: 8px; font-size: var(--text-xs); color: var(--meta); }
.msg .bubble {
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  font-size: var(--text-sm);
  line-height: 1.7;
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--border-soft);
}
.msg.me { justify-self: end; justify-items: end; }
.msg.me .bubble { background: var(--accent); border-color: transparent; color: var(--accent-on); border-bottom-right-radius: 6px; }
.msg.ai .bubble { border-bottom-left-radius: 6px; }
.msg .bubble p + p { margin-top: 8px; }
.typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--meta); animation: blink 1.2s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: 0.18s; }
.typing i:nth-child(3) { animation-delay: 0.36s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
.composer { display: flex; gap: var(--space-2); align-items: flex-end; }
.composer .textarea { min-height: 48px; max-height: 140px; }

/* ─── 原文高亮 / 引用 ───────────────────────────────────────────── */
.origin { font-size: var(--text-sm); line-height: 2; color: var(--fg-2); }
.origin p + p { margin-top: var(--space-3); }
.origin .page-tag { display: inline-block; font-size: 10px; color: var(--meta); border: 1px solid var(--border-soft); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.hl {
  background: color-mix(in oklab, var(--accent), transparent 88%);
  border-bottom: 2px solid color-mix(in oklab, var(--accent), transparent 45%);
  border-radius: 3px;
  padding: 0 2px;
  cursor: pointer;
  transition: background-color var(--motion-fast) var(--ease-standard);
}
.hl:hover { background: color-mix(in oklab, var(--accent), transparent 78%); }
.hl.active { background: color-mix(in oklab, var(--accent), transparent 66%); }
@keyframes flashcard { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent), transparent 40%); } 100% { box-shadow: 0 0 0 14px transparent; } }
.flash { animation: flashcard 1s var(--ease-standard) 2; }
.quote {
  border-left: 3px solid var(--border);
  background: var(--surface-warm);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 10px 14px;
  font-size: var(--text-sm);
  line-height: 1.7;
  color: var(--fg-2);
}

/* ─── 其它 ──────────────────────────────────────────────────────── */
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--space-5); align-items: start; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); align-items: start; }
.list-rows { display: grid; }
.list-row { display: flex; align-items: center; gap: var(--space-3); padding: 13px 4px; border-bottom: 1px solid var(--border-soft); min-width: 0; }
.list-row:last-child { border-bottom: 0; }
.banner {
  display: flex; align-items: flex-start; gap: 10px;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  font-size: var(--text-sm);
  line-height: 1.6;
}
.banner .icon { margin-top: 2px; }
.banner-info { background: color-mix(in oklab, var(--accent), transparent 94%); color: var(--fg-2); }
.banner-info .icon { color: var(--accent); }
.banner-warn { background: color-mix(in oklab, var(--warn), transparent 90%); color: color-mix(in oklab, var(--warn), var(--fg) 45%); }
.banner-warn .icon { color: var(--warn); }
.banner-danger { background: color-mix(in oklab, var(--danger), transparent 93%); color: color-mix(in oklab, var(--danger), var(--fg) 40%); }
.banner-danger .icon { color: var(--danger); }
.banner-success { background: color-mix(in oklab, var(--success), transparent 93%); color: color-mix(in oklab, var(--success), var(--fg) 35%); }
.banner-success .icon { color: var(--success); }
.kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: var(--fg-2); }
.dropzone {
  border: 1.5px dashed var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface-warm);
  padding: var(--space-8) var(--space-6);
  display: grid; justify-items: center; gap: 10px; text-align: center;
  cursor: pointer;
  transition: border-color var(--motion-base) var(--ease-standard), background-color var(--motion-base) var(--ease-standard);
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: color-mix(in oklab, var(--accent), transparent 96%); }
.dropzone .dz-icon { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--border-soft); color: var(--accent); }
.dropzone strong { font-size: var(--text-sm); }
.dropzone p { font-size: var(--text-xs); color: var(--muted); max-width: 44ch; line-height: 1.6; }
.meter { display: grid; gap: 6px; }
.meter .m-top { display: flex; align-items: baseline; justify-content: space-between; font-size: var(--text-xs); color: var(--muted); }
.member-card { display: grid; gap: 10px; padding: var(--space-4); }
.member-card .m-top { display: flex; align-items: center; gap: var(--space-3); }
.member-card .m-name { display: grid; line-height: 1.3; }
.member-card .m-name strong { font-size: var(--text-sm); font-weight: 600; }
.member-card .m-name span { font-size: var(--text-xs); color: var(--meta); }
.skill-chips { display: flex; flex-wrap: wrap; gap: 5px; }

@media (prefers-reduced-motion: reduce) {

/* ─── 启动占位 ──────────────────────────────────────────────────── */

}

}

/* ─── 登录（深色章节）───────────────────────────────────────────── */

.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); background: var(--stage); color: var(--bg); position: relative; overflow: hidden; }
.aurora { position: absolute; inset: 0; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; mix-blend-mode: screen; animation: drift 24s var(--ease-standard) infinite alternate; will-change: transform; }
.aurora i:nth-child(1) { width: 58vmax; height: 58vmax; left: -14vmax; top: -20vmax; background: radial-gradient(circle at 35% 35%, color-mix(in oklab, var(--accent), transparent 40%), transparent 62%); }
.aurora i:nth-child(2) { width: 46vmax; height: 46vmax; right: -12vmax; bottom: -16vmax; background: radial-gradient(circle at 60% 40%, color-mix(in oklab, var(--accent), var(--bg) 30%) , transparent 60%); animation-delay: -8s; animation-duration: 30s; }
.aurora i:nth-child(3) { width: 30vmax; height: 30vmax; left: 34%; top: 44%; background: radial-gradient(circle at 50% 50%, color-mix(in oklab, var(--accent-active), transparent 55%), transparent 65%); opacity: 0.35; animation-delay: -15s; animation-duration: 34s; }
.aurora .grid-lines {
  position: absolute; inset: 0; border-radius: 0; filter: none; mix-blend-mode: normal; opacity: 0.5; animation: none;
  background-image: linear-gradient(color-mix(in oklab, var(--bg), transparent 96%) 1px, transparent 1px), linear-gradient(90deg, color-mix(in oklab, var(--bg), transparent 96%) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 78%);
          mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 78%);
}
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(4vmax, 3vmax, 0) scale(1.12); } }
.login-story { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(28px, 5vw, 72px); gap: var(--space-8); }
.login-brand { display: flex; align-items: center; gap: 12px; }
.login-brand .rail-mark { background: var(--bg); color: var(--stage); }
.login-brand .rail-name strong { color: var(--bg); }
.login-brand .rail-name span { color: color-mix(in oklab, var(--bg), transparent 45%); }
.login-hero { display: grid; gap: var(--space-5); max-width: 34ch; }
.login-hero h1 { color: var(--bg); font-size: clamp(34px, 4.6vw, 54px); font-weight: 600; line-height: 1.06; letter-spacing: -0.02em; }
.login-hero .lead { color: color-mix(in oklab, var(--bg), transparent 30%); font-size: var(--text-base); line-height: 1.7; }
.login-flow { display: flex; flex-wrap: wrap; gap: 6px; }
.login-flow span { font-size: var(--text-xs); color: color-mix(in oklab, var(--bg), transparent 34%); border: 1px solid color-mix(in oklab, var(--bg), transparent 86%); border-radius: var(--radius-pill); padding: 4px 11px; }
.login-flow span.on { color: var(--bg); border-color: color-mix(in oklab, var(--accent), transparent 30%); background: color-mix(in oklab, var(--accent), transparent 62%); }
.login-foot { font-size: var(--text-xs); color: color-mix(in oklab, var(--bg), transparent 55%); line-height: 1.8; }
.login-panel { position: relative; z-index: 1; display: grid; place-items: center; padding: clamp(20px, 4vw, 56px); }
.login-card {
  width: min(420px, 100%);
  background: var(--glass-dark);
  -webkit-backdrop-filter: saturate(160%) blur(22px); backdrop-filter: saturate(160%) blur(22px);
  border: 1px solid color-mix(in oklab, var(--bg), transparent 88%);
  border-radius: var(--radius-lg);

}

.login-card .field > label { color: color-mix(in oklab, var(--bg), transparent 18%); }

.login-card .input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 60%); }
.login-card .help { color: color-mix(in oklab, var(--bg), transparent 52%); }
.login-actions { display: flex; align-items: center; gap: var(--space-2); }
.login-actions .btn-sec { color: var(--bg); border-color: color-mix(in oklab, var(--bg), transparent 74%); }
.login-actions .btn-sec:hover { background: color-mix(in oklab, var(--bg), transparent 90%); border-color: color-mix(in oklab, var(--bg), transparent 46%); }
.login-card .badge-demo { color: color-mix(in oklab, var(--bg), transparent 12%); background: color-mix(in oklab, var(--accent), transparent 66%); border-color: transparent; }
.login-steps-note { font-size: var(--text-xs); color: color-mix(in oklab, var(--bg), transparent 55%); line-height: 1.7; }
.code-row { display: flex; gap: var(--space-2); }
.code-row .input { letter-spacing: 0.4em; font-family: var(--font-mono); }

/* ─── 项目入口 ──────────────────────────────────────────────────── */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4); }

/* ─── 概览 ──────────────────────────────────────────────────────── */
.overview-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-6); align-items: center; padding: var(--space-6) var(--space-8); background: linear-gradient(115deg, var(--surface-warm), var(--bg) 62%); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); }

.overview-hero .sub { margin-top: 10px; color: var(--muted); font-size: var(--text-sm); line-height: 1.7; max-width: 56ch; }
.overview-actions { margin-top: var(--space-5); display: flex; gap: var(--space-2); flex-wrap: wrap; }
.overview-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-4); align-items: start; }
.ov-span-7 { grid-column: span 7; }
.ov-span-5 { grid-column: span 5; }
.ov-span-4 { grid-column: span 4; }
.ov-span-8 { grid-column: span 8; }
.deadline-card { display: grid; justify-items: center; gap: var(--space-3); text-align: center; padding: var(--space-6) var(--space-5); }
.deadline-card .date { font-family: var(--font-display), sans-serif; font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; }

.mini-list { display: grid; gap: 2px; }
.mini-item { display: flex; align-items: center; gap: var(--space-3); padding: 11px 6px; border-radius: var(--radius-sm); min-width: 0; transition: background-color var(--motion-fast) var(--ease-standard); }
.mini-item:hover { background: var(--surface-warm); }
.mini-item .m-body { min-width: 0; flex: 1; }
.mini-item .m-title { font-size: var(--text-sm); line-height: 1.45; }
.mini-item .m-sub { font-size: var(--text-xs); color: var(--meta); margin-top: 2px; }

/* ─── 底部导航（移动端）─────────────────────────────────────────── */
.tabbar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));

}

  display: grid; place-items: center; gap: 3px;

  border-radius: var(--radius-sm);

  min-height: 44px;
}

/* ─── 通知导入 ──────────────────────────────────────────────────── */
.import-panel { display: grid; gap: var(--space-4); }

.file-pill .name span { font-size: var(--text-xs); color: var(--meta); }
.file-pill .btn-icon { margin-left: auto; }
.parse-stage { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
.result-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
.result-cell { padding: var(--space-4); border: 1px solid var(--border-soft); border-radius: var(--radius-md); background: var(--surface-warm); display: grid; gap: 4px; }
.result-cell strong { font-family: var(--font-display), sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.result-cell span { font-size: var(--text-xs); color: var(--muted); }

/* ─── 要求确认 ──────────────────────────────────────────────────── */
.req-progress { display: flex; align-items: center; gap: var(--space-3); }

.req-card { display: grid; gap: 10px; padding: var(--space-4) var(--space-5); }

/* ─── AI 工作区 ─────────────────────────────────────────────────── */

.draft {

/* ─── 材料中心 ──────────────────────────────────────────────────── */
.materials-layout { display: grid; grid-template-columns: minmax(0, 3.2fr) minmax(0, 8.8fr); gap: var(--space-5); align-items: start; }
.mat-list { display: grid; gap: 6px; position: sticky; top: calc(var(--topbar-h) + var(--space-4)); }
.mat-item {
  display: grid; gap: 4px; text-align: left;
  padding: 12px 14px; border-radius: var(--radius-md);

  transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}

.editor-toolbar { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--border-soft); border-bottom: 0; border-radius: var(--radius-md) var(--radius-md) 0 0; background: var(--surface-warm); }
.editor-toolbar .tb-sep { width: 1px; height: 18px; background: var(--border); margin-inline: 6px; }
.editor {
  border: 1px solid var(--border-soft); border-radius: 0 0 var(--radius-md) var(--radius-md);
  background: var(--bg);
  padding: clamp(18px, 4vw, 40px) clamp(18px, 5vw, 56px);
  min-height: 460px;
  font-size: var(--text-base);
  line-height: 1.9;
  outline: none;
  overflow-wrap: anywhere;
}

.editor h2 { font-size: var(--text-lg); margin: 22px 0 10px; }
.editor h2:first-child { margin-top: 0; }
.editor h3 { font-size: var(--text-base); margin: 18px 0 8px; }
.editor p + p { margin-top: 10px; }
.editor ul, .editor ol { margin: 10px 0 0; padding-left: 1.4em; }

.version-line { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--border-soft); min-width: 0; }

.version-line .v-body { min-width: 0; flex: 1; }
.version-line .v-note { font-size: var(--text-sm); line-height: 1.5; }
.version-line .v-sub { font-size: var(--text-xs); color: var(--meta); margin-top: 2px; }
.md-preview { font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.8; white-space: pre-wrap; word-break: break-word; background: var(--surface-warm); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: var(--space-4); max-height: 340px; overflow: auto; }
.conflict-box { display: grid; gap: var(--space-3); }
.conflict-col { border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: var(--space-4); }
.conflict-col h4 { font-size: var(--text-sm); margin-bottom: 6px; }
.conflict-col .small { color: var(--muted); line-height: 1.7; }

/* ─── 预审 ──────────────────────────────────────────────────────── */
.review-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-6); align-items: center; }
.review-score-meta { display: grid; gap: 8px; }
.dim-row { display: grid; grid-template-columns: minmax(0, 2.2fr) 64px 1fr; gap: var(--space-3); align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--border-soft); font-size: var(--text-sm); }
.dim-row:last-child { border-bottom: 0; }
.dim-row .d-score { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-sm); }
.dim-row .d-score.qual { color: var(--muted); font-size: var(--text-xs); }
.dim-bar { height: 5px; border-radius: 99px; background: var(--border-soft); overflow: hidden; }
.dim-bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; width: 0; transition: width 900ms var(--ease-standard) 120ms; }

/* ─── 答辩演练 ──────────────────────────────────────────────────── */
.rehearsal-hall { max-width: 780px; margin-inline: auto; display: grid; gap: var(--space-4); }
.rehearsal-bar { display: flex; align-items: center; gap: var(--space-3); padding: 12px 18px; border: 1px solid var(--border-soft); border-radius: var(--radius-lg); background: var(--surface-warm); flex-wrap: wrap; }
.rehearsal-bar .pbar { width: 150px; }
.summary-list { display: grid; gap: 10px; }
.summary-list li { font-size: var(--text-sm); line-height: 1.7; }

/* ─── 过程账本 ──────────────────────────────────────────────────── */
.ledger-toolbar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-5); }
.ledger-group { display: grid; gap: var(--space-2); margin-bottom: var(--space-6); }
.ledger-day { font-size: var(--text-xs); color: var(--meta); font-weight: 600; letter-spacing: 0.04em; position: sticky; top: calc(var(--topbar-h) + 4px); background: var(--bg); padding: 6px 0; z-index: 2; }
.corrected-tag { font-size: 10px; color: var(--danger); border: 1px solid color-mix(in oklab, var(--danger), transparent 60%); border-radius: 5px; padding: 0 5px; }

/* ─── 设置 ──────────────────────────────────────────────────────── */
.settings-grid { display: grid; gap: var(--space-5); max-width: 860px; }
.set-row { display: flex; align-items: center; gap: var(--space-4); padding: 13px 0; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
.set-row:last-child { border-bottom: 0; }
.set-row .s-label { width: 150px; flex: none; font-size: var(--text-sm); color: var(--muted); }
.set-row .s-body { flex: 1; min-width: 220px; font-size: var(--text-sm); }
.cap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-3); }
.cap-cell { padding: 13px 16px; border-radius: var(--radius-md); background: var(--surface-warm); border: 1px solid var(--border-soft); display: grid; gap: 3px; }
.cap-cell strong { font-size: var(--text-sm); font-family: var(--font-mono); font-weight: 600; }
.cap-cell span { font-size: var(--text-xs); color: var(--meta); }

/* ─── 响应式 ────────────────────────────────────────────────────── */
@media (max-width: 1200px) {
  .ai-layout, .materials-layout { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
}
@media (max-width: 1023px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .tabbar { display: block; }
  .view { padding: var(--space-6) var(--space-4) calc(96px + env(safe-area-inset-bottom, 0px)); }
  .topbar { padding-inline: var(--space-4); }
  .split, .parse-stage, .grid-2, .ai-layout, .materials-layout { grid-template-columns: minmax(0, 1fr); }
  .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .overview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ov-span-7, .ov-span-5, .ov-span-4, .ov-span-8 { grid-column: span 2; }
  .review-top { grid-template-columns: minmax(0, 1fr); justify-items: start; gap: var(--space-4); }
  .kanban { min-width: 980px; }
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-story { padding-bottom: 0; }
  .overview-hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 639px) {

  .topbar-deadline { display: none; }
  .kanban { min-width: 900px; }

  .dim-row { grid-template-columns: minmax(0, 1fr) 54px; }
  .dim-row .d-barwrap { grid-column: span 2; }
  .set-row .s-label { width: 100%; }
  .modal { padding: var(--space-5); }
  .hide-sm { display: none !important; }
  .crumb-root { display: none; }

  @page { margin: 16mm 14mm; }

  el.className = 'toast';

}

function printNode(html) {

  area.innerHTML = html;
  const clear = () => { area.innerHTML = ''; window.removeEventListener('afterprint', clear); };
  window.addEventListener('afterprint', clear);

function mdFromHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  const lines = [];
  const walk = (n) => {
    if (n.nodeType === 3) { const t = n.textContent.replace(/\s+/g, ' '); if (t.trim()) lines.push(t.trim()); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    if (/^h[1-6]$/.test(tag)) { lines.push(''); lines.push('#'.repeat(Number(tag[1])) + ' ' + n.textContent.trim()); return; }
    if (tag === 'p') { lines.push(''); lines.push(inline(n)); return; }
    if (tag === 'ul' || tag === 'ol') {
      lines.push('');
      Array.prototype.forEach.call(n.children, (li, i) => { lines.push((tag === 'ol' ? (i + 1) + '. ' : '- ') + inline(li)); });
      return;
    }
    if (tag === 'table') {
      lines.push('');
      Array.prototype.forEach.call(n.querySelectorAll('tr'), (tr, ri) => {
        const cells = Array.prototype.map.call(tr.children, (td) => td.textContent.trim().replace(/\|/g, '\\|'));
        lines.push('| ' + cells.join(' | ') + ' |');
        if (ri === 0) lines.push('| ' + cells.map(() => '---').join(' | ') + ' |');
      });
      return;
    }
    if (tag === 'br') { lines.push(''); return; }
    Array.prototype.forEach.call(n.childNodes, walk);
  };
  function inline(n) {
    let s = '';
    Array.prototype.forEach.call(n.childNodes, (c) => {
      if (c.nodeType === 3) { s += c.textContent.replace(/\s+/g, ' '); return; }
      if (c.nodeType !== 1) return;
      const t = c.tagName.toLowerCase();
      if (t === 'strong' || t === 'b') s += '**' + c.textContent + '**';
      else if (t === 'em' || t === 'i') s += '*' + c.textContent + '*';
      else if (t === 'a') s += '[' + c.textContent + '](' + (c.getAttribute('href') || '') + ')';
      else if (t === 'code') s += '`' + c.textContent + '`';
      else s += c.textContent;
    });
    return s.trim();
  }
  Array.prototype.forEach.call(d.childNodes, walk);
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function copyText(text, okMsg) {
  const done = () => toast(okMsg || '已复制到剪贴板', 'success');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败：请手动选择文本复制', 'error'); }
  ta.remove();
}

function impLog(html) { UI.imp.logs.push(html); }
async function parseRun(kind, label) {
  UI.imp.phase = 'parsing'; UI.imp.result = null; UI.imp.logs = [];
  refresh();
  const steps = ['校验文件与大小限制', '提取 PDF 文本层', '识别扫描页（视觉模型）', '提取要求与引用（文本模型）', '结构与引用校验'];
  if (kind === 'link') steps[0] = '校验链接与允许域名';
  const stepEls = $$('#imp-steps .step');
  const bar = $('#imp-bar i'); const logEl = $('#imp-log');
  const push = (html) => { impLog(html); logEl.innerHTML = UI.imp.logs.map((l) => '<div>' + l + '</div>').join(''); logEl.scrollTop = logEl.scrollHeight; };
  const setStep = (i, s) => { if (stepEls[i]) { stepEls[i].setAttribute('data-s', s); $('.s-dot', stepEls[i]).innerHTML = s === 'done' ? icon('check') : s === 'run' ? icon('play') : ''; } };
  const wait = (ms) => sleep(reduceMotion() ? Math.min(120, ms) : ms);
  for (let i = 0; i < steps.length; i++) {
    setStep(i, 'run');
    bar.style.width = Math.round(((i + 0.4) / steps.length) * 100) + '%';
    await wait(560 + i * 160);
    if (i === 0) push('<span class="l-ok">✓</span> ' + esc(kind === 'link' ? '链接可访问（演示）：' + label : '校验通过：' + label + '（≤ 10 MiB / ≤ 30 页）'));
    if (i === 1) push('<span class="l-ok">✓</span> 文本层提取完成：第 1–2 页');
    if (i === 2) {
      push('<span class="l-run">▶</span> 视觉识别第 3 页（疑似扫描页）…');
      await wait(720);
      push('<span class="l-err">✕</span> 第 3 页识别失败：图像清晰度不足（演示）—— 已标记待人工补充');
    }
    if (i === 3) push('<span class="l-ok">✓</span> 提取要求 7 条 · 日期 2 个 · 材料 3 项（模拟）');
    if (i === 4) push('<span class="l-ok">✓</span> 引用校验通过：7/7 条可在原文定位');
    setStep(i, 'done');
    bar.style.width = Math.round(((i + 1) / steps.length) * 100) + '%';
  }
  UI.imp.phase = 'done';
  UI.imp.result = { reqs: DB.requirements.length, dates: 2, mats: 3, failPage: 3 };
  refresh();
  toast('解析完成（模拟）：7 条要求待确认', 'success');
}

    return `
    <div class="wrap">
      <div class="page-head">
        <div><h1>通知导入</h1><p class="sub">支持图片 / PDF、粘贴文字、公开网页链接。解析流程为本地模拟：文本层提取 → 扫描页识别 → 要求提取 → 引用校验。</p></div>

      </div>
      <div class="card" id="imp-area">${body}</div>

      <div class="banner banner-info">${icon('info')}<div>规则：链接无法读取时保留链接并引导改用文件或文字；重新解析显示新旧差异，不覆盖已确认内容。</div></div>
    </div>`;
  },
  bind() {
    $$('[data-imp-tab]').forEach((b) => b.addEventListener('click', () => { UI.importTab = b.getAttribute('data-imp-tab'); refresh(); }));
    const drop = $('#imp-drop');
    const input = $('#imp-file');
    const startBtn = $('[data-act="parse-start"]');
    let picked = null;
    const setPicked = (f) => {
      picked = f;
      $('#imp-file-pill').innerHTML = '<div style="height:12px"></div><div class="file-pill">' + icon('file') +
        '<span class="name"><strong>' + esc(f.name) + '</strong><span>' + f.size + '</span></span>' +
        '<button class="btn-icon" type="button" data-act="clear-file" aria-label="移除文件">' + icon('x') + '</button></div>';
      startBtn.removeAttribute('aria-disabled');
      $('[data-act="clear-file"]').addEventListener('click', () => { picked = null; $('#imp-file-pill').innerHTML = ''; startBtn.setAttribute('aria-disabled', 'true'); });
    };
    if (drop && input) {
      drop.addEventListener('click', () => input.click());
      drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
      ['dragover', 'dragenter'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
      ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
      drop.addEventListener('drop', (e) => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleFile(f); });
      input.addEventListener('change', () => { if (input.files && input.files[0]) handleFile(input.files[0]); });
    }

    if (br) br.addEventListener('click', () => { DB.rehearsal = { active: false, scope: 'all', memberId: null, qIndex: 0, finished: false, msgs: [], pendingFollow: false }; refresh(); });
    const fin = $('[data-act="finish-rehearse"]');
    if (fin) fin.addEventListener('click', () => { DB.rehearsal.finished = true; DB.rehearsal.active = false; saveDB(); refresh(); });
    const send = $('[data-act="rh-send"]');
    if (send) send.addEventListener('click', () => {
      const r = DB.rehearsal;
      const v = $('#rh-input').value.trim();
      if (v.length < 2) { toast('请输入你的回答', 'warn'); return; }
      r.msgs.push({ role: 'me', text: v });
      const chat = $('#rh-chat');
      const typing = document.createElement('div');
      typing.className = 'msg ai';
      typing.innerHTML = '<span class="msg-meta">' + icon('sparkles') + '模拟 AI</span><span class="bubble"><span class="typing"><i></i><i></i><i></i></span></span>';
      chat.appendChild(typing);
      $('#rh-input').value = '';
      const step = REHEARSE_BANK[r.qIndex];
      setTimeout(() => {
        if (!r.pendingFollow && step.follow) {
          r.msgs.push({ role: 'ai', text: '反馈：' + step.fb });
          r.msgs.push({ role: 'ai', text: '追问：' + step.follow, basis: step.basis });
          r.pendingFollow = true;
        } else {
          if (!r.pendingFollow) r.msgs.push({ role: 'ai', text: '反馈：' + step.fb });
          r.pendingFollow = false;
          r.qIndex += 1;
          if (r.qIndex < REHEARSE_BANK.length) r.msgs.push({ role: 'ai', text: REHEARSE_BANK[r.qIndex].q, basis: REHEARSE_BANK[r.qIndex].basis });
          else { r.finished = true; r.active = false; toast('全部问题已完成，生成总结', 'success'); }
        }
        saveDB(); refresh();
      }, reduceMotion() ? 160 : 850);
    });
  }
};

/* ═══════════ 路由 / 全局交互 / 启动 ═══════════ */
function parseRoute() {
  const h = decodeURIComponent(String(location.hash || '').replace(/^#\/?/, '')).trim();
  if (!h || h === 'more') return DB.session.loggedIn ? 'overview' : 'login';
  return h;
}
function render(resetScroll) {
  const r = UI.route;
  const view = VIEWS[r] || VIEWS.login;
  $('#app').hidden = false;
  renderRail(); renderTopbar(); renderTabbar();
  const v = $('#view');
  v.innerHTML = view.render();
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  if (view.bind) view.bind();
  if (resetScroll) window.scrollTo({ top: 0, behavior: 'auto' });
}
function refresh() { render(false); }
function applyRoute(r) {
  if (!DB.session.loggedIn && r !== 'login') { location.hash = '#/login'; UI.route = 'login'; }
  else if (DB.session.loggedIn && r === 'login') { location.hash = '#/overview'; UI.route = 'overview'; }
  else UI.route = VIEWS[r] ? r : (DB.session.loggedIn ? 'overview' : 'login');
  document.body.setAttribute('data-route', UI.route);
  render(true);
}
window.addEventListener('hashchange', () => {
  const r = parseRoute();
  applyRoute(r);
});
document.addEventListener('click', (e) => {
  const t = e.target;
  if (!t || !t.closest) return;
  const moreLink = t.closest('[data-act="more-nav"]');
  if (moreLink) { e.preventDefault(); openMoreNav(); return; }
  const acc = t.closest('[data-act="account"]');
  if (acc) { openAccount(); return; }
  const goEl = t.closest('[data-go]');
  if (goEl) { go(goEl.getAttribute('data-go')); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { /* 弹层自行处理；此处保留给将来扩展 */ }
});
(function boot() {
  const splash = $('#boot-splash');
  const r = parseRoute();
  UI.route = DB.session.loggedIn ? (VIEWS[r] ? r : 'overview') : 'login';
  document.body.setAttribute('data-route', UI.route);
  render(true);
  setTimeout(() => { if (splash) { splash.classList.add('gone'); setTimeout(() => splash.remove(), 340); } }, 260);
})();
  </script>
