version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @cloudflare/vitest-pool-workers (latest 0.23.0) peer-requires vitest ^4.1.0,
      # so a backend vitest major cannot be adopted yet.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x peer-requires typescript >=4.8.4 <6.1.0, and eslint fails
      # hard on TS 7 ("typescript-eslint does not support TS 7.0").
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
