name: Windows desktop draft release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native client
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Test release manifest
        run: node --test desktop/scripts/release-manifest.test.mjs
      - name: Build signed current-user NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./desktop/scripts/build.ps1
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          ./desktop/scripts/publish-draft.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-signed-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
